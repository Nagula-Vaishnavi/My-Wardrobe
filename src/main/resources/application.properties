spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/mywardrobe}
spring.datasource.username=root
spring.datasource.password=root

# JWT_SECRET must contain at least 32 UTF-8 bytes for HS256.
mywardrobe.jwt.secret=${JWT_SECRET}
mywardrobe.stylist.gemini-model=${GEMINI_MODEL:gemini-3.6-flash}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


