# Tests run against an isolated in-memory database and never connect to the user's MySQL database.
spring.datasource.url=jdbc:h2:mem:mywardrobe_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
mywardrobe.jwt.secret=OnlyForTests-32-bytes-minimum-secret-value
